services:
  - type: web
    name: signaldesk
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: signaldesk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SIGNALDESK_DB
        value: /var/data/signaldesk.sqlite
      - key: SIGNALDESK_USERNAME
        value: reviewer
      - key: SIGNALDESK_PASSWORD
        sync: false
      - key: AI_DAILY_BUDGET_USD
        value: "0.50"
      - key: AI_INPUT_USD_PER_MILLION
        value: "0.40"
      - key: AI_OUTPUT_USD_PER_MILLION
        value: "1.60"
